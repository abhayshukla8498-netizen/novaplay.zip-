name: Build Vidiopen Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto Find and Unzip Project
        run: |
          echo "Finding zip file..."
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip archive: $ZIP_FILE. Extracting..."
            unzip -o "$ZIP_FILE" -d extracted_project
            # Agar zip ke andar koi nested folder hai, files ko bahar layein
            if [ -d "extracted_project/app" ]; then
              cp -r extracted_project/* .
            else
              SUBDIR=$(find extracted_project -mindepth 1 -maxdepth 1 -type d | head -n 1)
              if [ -n "$SUBDIR" ]; then
                cp -r "$SUBDIR"/* .
              fi
            fi
            rm -rf extracted_project
          else
            echo "No zip file found, using repository root files."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Necessary Configuration Files
        run: |
          # 1. Create .env if missing
          if [ ! -f ".env" ]; then
            echo "GEMINI_API_KEY=dummy_key_placeholder" > .env
          fi

          # 2. Create google-services.json if missing
          mkdir -p app
          if [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "vidiopen-dummy",
              "storage_bucket": "vidiopen-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.vidiopen.videoplayer"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "dummy_api_key_for_build" }],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Fix CompileSDK Syntax If Present
        run: |
          if [ -f "app/build.gradle.kts" ]; then
            sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/g' app/build.gradle.kts
            sed -i 's/targetSdk = 36/targetSdk = 35/g' app/build.gradle.kts
          fi

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias upload \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=Vidiopen, OU=Mobile, O=Vidiopen, L=Balrampur, ST=UP, C=IN"

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Generating wrapper using gradle 8.9..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: |
          ./gradlew clean :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vidiopen-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          
