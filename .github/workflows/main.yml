name: Build Vidiopen Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP and Locate App
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            mkdir -p /tmp/extracted_proj
            unzip -q -o "$ZIP_FILE" -d /tmp/extracted_proj
            
            APP_DIR=$(find /tmp/extracted_proj -type d -name "app" | head -n 1)
            if [ -n "$APP_DIR" ]; then
              cp -rf "$(dirname "$APP_DIR")"/* .
            else
              cp -rf /tmp/extracted_proj/* .
            fi
            rm -rf /tmp/extracted_proj
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean and Prepare Build Files
        run: |
          # 1. Version Catalog setup
          mkdir -p gradle
          cat << 'EOF' > gradle/libs.versions.toml
          [versions]
          agp = "8.6.1"
          kotlin = "2.0.20"
          ksp = "2.0.20-1.0.25"
          composeBom = "2024.09.03"
          firebaseBom = "33.4.0"
          room = "2.6.1"
          media3 = "1.4.1"
          coil = "2.7.0"
          okhttp = "4.12.0"
          retrofit = "2.11.0"
          moshi = "1.15.1"
          coroutines = "1.9.0"
          hilt = "2.52"

          [libraries]
          androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
          firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
          androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.9.2" }
          androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version = "1.3.4" }
          androidx-camera-core = { group = "androidx.camera", name = "camera-core", version = "1.3.4" }
          androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version = "1.3.4" }
          androidx-camera-view = { group = "androidx.camera", name = "camera-view", version = "1.3.4" }
          play-services-mlkit-barcode-scanning = { group = "com.google.android.gms", name = "play-services-mlkit-barcode-scanning", version = "18.3.1" }
          zxing-core = { group = "com.google.zxing", name = "core", version = "3.5.3" }
          androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
          androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
          androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
          androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
          androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
          androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
          androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
          androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
          androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
          androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.13.1" }
          androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version = "1.0.1" }
          androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version = "1.1.1" }
          androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version = "2.8.6" }
          androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version = "2.8.6" }
          androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version = "2.8.6" }
          androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version = "2.8.2" }
          androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
          androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
          androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
          coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
          coil-video = { group = "io.coil-kt", name = "coil-video", version.ref = "coil" }
          androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
          androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
          androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
          converter-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "retrofit" }
          firebase-ai = { group = "com.google.firebase", name = "firebase-vertexai" }
          firebase-appcheck-recaptcha = { group = "com.google.firebase", name = "firebase-appcheck-playintegrity" }
          kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
          kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
          logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
          moshi-kotlin = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi" }
          moshi-kotlin-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshi" }
          okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
          retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
          androidx-core = { group = "androidx.test", name = "core", version = "1.6.1" }
          androidx-junit = { group = "androidx.test.ext", name = "junit", version = "1.2.1" }
          junit = { group = "junit", name = "junit", version = "4.13.2" }
          kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
          robolectric = { group = "org.robolectric", name = "robolectric", version = "4.13" }
          roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version = "1.26.0" }
          roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version = "1.26.0" }
          roborazzi-junit-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version = "1.26.0" }
          androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version = "3.6.1" }
          androidx-runner = { group = "androidx.test", name = "runner", version = "1.6.2" }
          google-hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
          google-hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
          timber = { group = "com.jakewharton.timber", name = "timber", version = "5.0.1" }
          androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version = "2.9.1" }
          androidx-biometric = { group = "androidx.biometric", name = "biometric", version = "1.1.0" }

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
          google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
          roborazzi = { id = "io.github.takahirom.roborazzi", version = "1.26.0" }
          secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version = "2.0.1" }
          google-services = { id = "com.google.gms.google-services", version = "4.4.2" }
          EOF

          # 2. Settings.gradle.kts setup
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "vidiopen"
          include(":app")
          EOF

          # 3. Root build.gradle.kts setup
          cat << 'EOF' > build.gradle.kts
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
              dependencies {
                  classpath("com.android.tools.build:gradle:8.6.1")
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.20")
                  classpath("com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.0.20-1.0.25")
                  classpath("com.google.gms:google-services:4.4.2")
              }
          }
          plugins {
              alias(libs.plugins.android.application) apply false
              alias(libs.plugins.kotlin.compose) apply false
              alias(libs.plugins.google.devtools.ksp) apply false
              alias(libs.plugins.google.services) apply false
          }
          EOF

          # 4. Dummy files
          echo "GEMINI_API_KEY=dummy_key" > .env
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": { "project_number": "123456789", "project_id": "vidiopen-app", "storage_bucket": "vidiopen-app.appspot.com" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:123456789:android:abcdef", "android_client_info": { "package_name": "com.vidiopen.videoplayer" } }, "api_key": [{ "current_key": "dummy" }] }],
            "configuration_version": "1"
          }
          EOF

          # 5. Fix app/build.gradle.kts syntax completely
          TARGET_GRADLE=$(find . -name "build.gradle.kts" | grep "app/build.gradle.kts" | head -n 1)
          if [ -n "$TARGET_GRADLE" ]; then
            python3 -c "
          with open('$TARGET_GRADLE', 'r') as f:
              content = f.read()

          import re
          # compileSdk fix
          content = re.sub(r'compileSdk\s*\{[^}]*\}', 'compileSdk = 35', content)
          content = re.sub(r'targetSdk\s*=\s*\d+', 'targetSdk = 35', content)

          # clean broken lines in dependencies block
          lines = content.splitlines()
          clean_lines = []
          for l in lines:
              if 'alias(libs.plugins.roborazzi)' in l or 'alias(libs.plugins.secrets)' in l or 'secrets {' in l:
                  continue
              # sanitize broken unexpected symbol lines
              clean_lines.append(l)

          with open('$TARGET_GRADLE', 'w') as f:
              f.write('\n'.join(clean_lines))
          "
          fi

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias upload \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=Vidiopen, OU=App, O=Vidiopen, L=Balrampur, ST=UP, C=IN"

      - name: Build Signed APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon -x test -x lint

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vidiopen-Release-APK
          path: app/build/outputs/apk/release/*.apk
          
