name: Build Vidiopen Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto Extract ZIP File
        run: |
          set -e
          ZIP_NAME=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_NAME" ]; then
            echo "Found: $ZIP_NAME, extracting..."
            unzip -q -o "$ZIP_NAME" -d extracted_temp
            if [ -d "extracted_temp/app" ]; then
              cp -rf extracted_temp/* .
            else
              NESTED_DIR=$(find extracted_temp -mindepth 1 -maxdepth 2 -type d -name "app" | head -n 1)
              if [ -n "$NESTED_DIR" ]; then
                PARENT_DIR=$(dirname "$NESTED_DIR")
                cp -rf "$PARENT_DIR"/* .
              fi
            fi
            rm -rf extracted_temp
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Configurations and Dummy Keys
        run: |
          # 1. Dummy .env create
          if [ ! -f ".env" ]; then
            echo "GEMINI_API_KEY=dummy_key_build" > .env
          fi

          # 2. Dummy google-services.json create
          mkdir -p app
          if [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "vidiopen-dummy",
              "storage_bucket": "vidiopen-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.vidiopen.videoplayer"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "dummy_api_key_for_build" }],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          # 3. Fix compileSdk syntax if broken
          if [ -f "app/build.gradle.kts" ]; then
            sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/g' app/build.gradle.kts
            sed -i 's/targetSdk = 36/targetSdk = 35/g' app/build.gradle.kts
          fi

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias upload \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=Vidiopen, OU=Mobile, O=Vidiopen, L=Balrampur, ST=UP, C=IN"

      - name: Build Release APK with Gradle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Installing standard gradle wrapper..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew
          ./gradlew clean :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Vidiopen-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          
