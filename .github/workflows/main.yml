name: Build Vidiopen Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP and Align Project Root
        run: |
          set -e
          echo "Current directory files before extraction:"
          ls -la

          # 1. Agar zip file exist karti hai toh extract karein
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -q -o "$ZIP_FILE" -d extracted_unzip_folder
            
            # Agar zip ke andar kisi folder me settings.gradle ya app folder hai, to use root me move karein
            TARGET_DIR=$(find extracted_unzip_folder -type f -name "build.gradle*" | head -n 1 | xargs -r dirname)
            if [ -n "$TARGET_DIR" ]; then
              # Agar build.gradle app folder ke andar mila, to uska parent project root hoga
              if [ "$(basename "$TARGET_DIR")" = "app" ]; then
                PROJECT_ROOT=$(dirname "$TARGET_DIR")
              else
                PROJECT_ROOT="$TARGET_DIR"
              fi
              echo "Moving files from $PROJECT_ROOT to repository root..."
              cp -rf "$PROJECT_ROOT"/* .
            else
              cp -rf extracted_unzip_folder/* .
            fi
            rm -rf extracted_unzip_folder
          fi

          echo "Files in root after aligning:"
          ls -la

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Configurations and Dummy Keys
        run: |
          # 1. Dummy .env banayein agar nahi hai
          if [ ! -f ".env" ]; then
            echo "GEMINI_API_KEY=dummy_key_build" > .env
          fi

          # 2. Dummy google-services.json banayein agar app folder me nahi hai
          mkdir -p app
          if [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "vidiopen-dummy",
              "storage_bucket": "vidiopen-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.vidiopen.videoplayer"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "dummy_api_key_for_build" }],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          # 3. Settings file verify / create
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "Creating fallback settings.gradle.kts..."
            cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "novaplay"
          include(":app")
          EOF
          fi

          # 4. Fix compileSdk syntax agar app/build.gradle.kts me issue ho
          if [ -f "app/build.gradle.kts" ]; then
            sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/g' app/build.gradle.kts
            sed -i 's/targetSdk = 36/targetSdk = 35/g' app/build.gradle.kts
          fi

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias upload \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=Vidiopen, OU=Mobile, O=Vidiopen, L=Balrampur, ST=UP, C=IN"

      - name: Build Release APK with Gradle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Generating wrapper using gradle 8.9..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew
          ./gradlew clean :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Vidiopen-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          
