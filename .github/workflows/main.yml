name: Build Vidiopen Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP and Locate App
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            mkdir -p /tmp/extracted_proj
            unzip -q -o "$ZIP_FILE" -d /tmp/extracted_proj
            
            APP_DIR=$(find /tmp/extracted_proj -type d -name "app" | head -n 1)
            if [ -n "$APP_DIR" ]; then
              cp -rf "$(dirname "$APP_DIR")"/* .
            else
              cp -rf /tmp/extracted_proj/* .
            fi
            rm -rf /tmp/extracted_proj
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Valid Clean Build Configuration
        run: |
          # 1. Enable AndroidX in gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          EOF

          # 2. Version Catalog setup
          mkdir -p gradle
          cat << 'EOF' > gradle/libs.versions.toml
          [versions]
          agp = "8.6.1"
          kotlin = "2.0.20"
          ksp = "2.0.20-1.0.25"
          composeBom = "2024.09.03"
          room = "2.6.1"
          media3 = "1.4.1"
          coil = "2.7.0"
          okhttp = "4.12.0"
          retrofit = "2.11.0"
          moshi = "1.15.1"
          coroutines = "1.9.0"

          [libraries]
          androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
          androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.9.2" }
          androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version = "1.3.4" }
          androidx-camera-core = { group = "androidx.camera", name = "camera-core", version = "1.3.4" }
          androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version = "1.3.4" }
          androidx-camera-view = { group = "androidx.camera", name = "camera-view", version = "1.3.4" }
          play-services-mlkit-barcode-scanning = { group = "com.google.android.gms", name = "play-services-mlkit-barcode-scanning", version = "18.3.1" }
          zxing-core = { group = "com.google.zxing", name = "core", version = "3.5.3" }
          androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
          androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
          androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
          androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
          androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
          androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
          androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
          androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.13.1" }
          androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version = "1.0.1" }
          androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version = "1.1.1" }
          androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version = "2.8.6" }
          androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version = "2.8.6" }
          androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version = "2.8.6" }
          androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version = "2.8.2" }
          androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
          androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version = "2.8.6" }
          androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
          coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
          coil-video = { group = "io.coil-kt", name = "coil-video", version.ref = "coil" }
          androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
          androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
          androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
          converter-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "retrofit" }
          kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
          kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
          logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
          moshi-kotlin = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi" }
          moshi-kotlin-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshi" }
          okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
          retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
          timber = { group = "com.jakewharton.timber", name = "timber", version = "5.0.1" }
          androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version = "2.9.1" }
          androidx-biometric = { group = "androidx.biometric", name = "biometric", version = "1.1.0" }

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
          google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
          EOF

          # 3. Settings.gradle.kts setup
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "vidiopen"
          include(":app")
          EOF

          # 4. Root build.gradle.kts setup
          cat << 'EOF' > build.gradle.kts
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
              dependencies {
                  classpath("com.android.tools.build:gradle:8.6.1")
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.20")
                  classpath("com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.0.20-1.0.25")
              }
          }
          plugins {
              alias(libs.plugins.android.application) apply false
              alias(libs.plugins.kotlin.compose) apply false
              alias(libs.plugins.google.devtools.ksp) apply false
          }
          EOF

          # 5. Dummy config files
          echo "GEMINI_API_KEY=dummy_key" > .env
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": { "project_number": "123456789", "project_id": "vidiopen-app", "storage_bucket": "vidiopen-app.appspot.com" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:123456789:android:abcdef", "android_client_info": { "package_name": "com.vidiopen.videoplayer" } }, "api_key": [{ "current_key": "dummy" }] }],
            "configuration_version": "1"
          }
          EOF

          # 6. Overwrite app/build.gradle.kts with verified syntax
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.compose)
              alias(libs.plugins.google.devtools.ksp)
          }

          android {
              namespace = "com.vidiopen.videoplayer"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.vidiopen.videoplayer"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("KEYSTORE_PATH") ?: "../my-upload-key.jks")
                      storePassword = System.getenv("STORE_PASSWORD") ?: "android123"
                      keyAlias = "upload"
                      keyPassword = System.getenv("KEY_PASSWORD") ?: "android123"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }
          }

          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.lifecycle.runtime.ktx)
              implementation(libs.androidx.activity.compose)
              implementation(platform(libs.androidx.compose.bom))
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.ui.graphics)
              implementation(libs.androidx.compose.ui.tooling.preview)
              implementation(libs.androidx.compose.material3)
              implementation(libs.androidx.compose.material.icons.core)
              implementation(libs.androidx.compose.material.icons.extended)
              implementation(libs.androidx.navigation.compose)
              implementation(libs.androidx.lifecycle.viewmodel.compose)
              implementation(libs.androidx.lifecycle.runtime.compose)

              implementation(libs.androidx.media3.exoplayer)
              implementation(libs.androidx.media3.ui)
              implementation(libs.androidx.media3.session)

              implementation(libs.androidx.room.runtime)
              implementation(libs.androidx.room.ktx)
              ksp(libs.androidx.room.compiler)

              implementation(libs.coil.compose)
              implementation(libs.coil.video)

              implementation(libs.androidx.datastore.preferences)
              implementation(libs.androidx.documentfile)
              implementation(libs.androidx.biometric)
              implementation(libs.androidx.work.runtime.ktx)
              implementation(libs.timber)

              implementation(libs.retrofit)
              implementation(libs.converter.moshi)
              implementation(libs.moshi.kotlin)
              ksp(libs.moshi.kotlin.codegen)
              implementation(libs.okhttp)
              implementation(libs.logging.interceptor)

              implementation(libs.kotlinx.coroutines.core)
              implementation(libs.kotlinx.coroutines.android)

              implementation(libs.play.services.mlkit.barcode.scanning)
              implementation(libs.zxing.core)
              implementation(libs.androidx.camera.core)
              implementation(libs.androidx.camera.camera2)
              implementation(libs.androidx.camera.lifecycle)
              implementation(libs.androidx.camera.view)
          }
          EOF

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias upload \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=Vidiopen, OU=App, O=Vidiopen, L=Balrampur, ST=UP, C=IN"

      - name: Build Signed APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon -x test -x lint

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vidiopen-Release-APK
          path: app/build/outputs/apk/release/*.apk
          
